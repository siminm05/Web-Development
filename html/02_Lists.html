<html>

    <body>
        <h4>Unordered List</h4>
        <p>Games i love in no particular order</p>
        <ul>
            <li>Roblox</li>
            <li>Minecraft</li>
            <li>Monopoly</li>

        <h4>Ordered List</h4>

            <li>World War Z</li>

            <li>Red Read Redemption</li>
        </ol>
        
    </body>
</html>
